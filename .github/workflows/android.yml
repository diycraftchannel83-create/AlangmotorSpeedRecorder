name: Android APK

on:
  push:
    branches: [main, "patch/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Gradle wrapper without overwriting app sources
        run: |
          flutter create --platforms=android --project-name alangmotor_speed_recorder --org com.alangmotor /tmp/flutter_bootstrap
          mkdir -p android/gradle/wrapper
          cp /tmp/flutter_bootstrap/android/gradlew android/gradlew
          cp /tmp/flutter_bootstrap/android/gradlew.bat android/gradlew.bat
          cp /tmp/flutter_bootstrap/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/flutter_bootstrap/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          # The repository was bootstrapped from an empty repo, so copy the
          # generated Android resources required by LaunchTheme and launcher icon.
          mkdir -p android/app/src/main
          cp -R /tmp/flutter_bootstrap/android/app/src/main/res android/app/src/main/res
          chmod +x android/gradlew
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alangmotor-speed-recorder-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
