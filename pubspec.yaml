name: alangmotor_speed_recorder
description: Offline GPS speed recorder for motorcycles and cars.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: 13.0.2
  battery_plus: ^6.2.1
  sqflite: 2.4.1
  path: 1.9.1
  permission_handler: 11.3.1
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
